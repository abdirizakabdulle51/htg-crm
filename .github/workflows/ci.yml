name: CI

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: htgcrm_test
          POSTGRES_USER: htg
          POSTGRES_PASSWORD: testpass
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.2-alpine
        ports:
          - "6379:6379"

    env:
      DATABASE_URL: postgres://htg:testpass@localhost:5432/htgcrm_test?sslmode=disable
      REDIS_ADDR: localhost:6379
      KEYCLOAK_AUDIENCE: crm-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Run migrations
        run: go run cmd/migrate/main.go up

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: run ./...

      - name: Run Go tests
        run: go test ./... -race -count=1 -coverprofile=coverage.out -timeout 120s

      - name: Enforce coverage threshold
        run: go tool cover -func=coverage.out | grep total | awk '{if ($3+0 < 70) exit 1}'

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: htg-crm-frontend

    env:
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-nextauth-secret
      KEYCLOAK_CLIENT_ID: crm-frontend
      KEYCLOAK_CLIENT_SECRET: ""
      KEYCLOAK_ISSUER: http://localhost:8080/realms/htg-crm
      NEXT_PUBLIC_API_URL: http://localhost:8081

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: htg-crm-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run Vitest
        run: npm run test

      - name: Build frontend
        run: npm run build
