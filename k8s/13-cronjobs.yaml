apiVersion: batch/v1
kind: CronJob
metadata:
  name: ai-analysis-placeholder
  namespace: htg-crm-prod
  annotations:
    note: "AI analysis is queue-triggered from htgcrm.ai.nightly_sync_complete; this placeholder is suspended intentionally."
spec:
  schedule: "0 2 * * *"
  suspend: true
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: crm-cronjob
            job: ai-analysis
        spec:
          restartPolicy: OnFailure
          containers:
            - name: ai-analysis
              image: ghcr.io/htgclouds/crm-api:1.0.0
              args: ["--job", "ai-analysis"]
              envFrom:
                - configMapRef:
                    name: htg-crm-config
                - secretRef:
                    name: htg-crm-secrets
