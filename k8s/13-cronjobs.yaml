apiVersion: batch/v1
kind: CronJob
metadata:
  name: usage-sync
  namespace: htg-crm-prod
spec:
  schedule: "0 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: crm-cronjob
            job: usage-sync
        spec:
          restartPolicy: OnFailure
          containers:
            - name: usage-sync
              image: ghcr.io/htgclouds/crm-api:1.0.0
              args: ["--job", "usage-sync"]
              envFrom:
                - configMapRef:
                    name: htg-crm-config
                - secretRef:
                    name: htg-crm-secrets
---
